# Tell browsers to check for a newer version of pages, scripts and styles
# every time (they still reuse their copy if nothing changed). Without this,
# browsers can keep using an old script.js after we deploy an update.
<FilesMatch "\.(html|js|css)$">
    Header set Cache-Control "no-cache"
</FilesMatch>

# API responses should never be cached.
<FilesMatch "\.php$">
    Header set Cache-Control "no-store"
</FilesMatch>

# Basic security headers (ISO/IEC 25010 security):
#  - nosniff: browsers must treat files as the type we say they are
#  - SAMEORIGIN: other websites can't show LIA inside a frame (stops click-jacking)
#  - Referrer-Policy: don't leak page addresses to other sites
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
ServerTokens Prod
ServerSignature Off
