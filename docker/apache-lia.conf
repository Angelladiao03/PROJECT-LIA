# Tell browsers to check for a newer version of pages, scripts and styles
# every time (they still reuse their copy if nothing changed). Without this,
# browsers can keep using an old script.js after we deploy an update.
<FilesMatch "\.(html|js|css)$">
    Header set Cache-Control "no-cache"
</FilesMatch>

# API responses should never be cached.
<FilesMatch "\.php$">
    Header set Cache-Control "no-store"
</FilesMatch>

# Basic security headers (ISO/IEC 25010 security):
#  - nosniff: browsers must treat files as the type we say they are
#  - SAMEORIGIN: other websites can't show LIA inside a frame (stops click-jacking)
#  - Referrer-Policy: don't leak page addresses to other sites
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

# Content-Security-Policy: the browser only runs scripts, styles, fonts, images
# and frames from the places listed here. If someone manages to sneak HTML into
# a report, scripts from other websites still won't run.
#   - fonts: Google Fonts   - images: our own + YouTube thumbnails + photo previews
#   - frames: YouTube (no-cookie) videos on the home page
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://i.ytimg.com; frame-src https://www.youtube-nocookie.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

# HSTS: once a browser has visited LIA over HTTPS, it always uses HTTPS (Render provides HTTPS).
Header always set Strict-Transport-Security "max-age=31536000"
ServerTokens Prod
ServerSignature Off
