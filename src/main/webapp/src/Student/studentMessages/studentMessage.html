<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LagroInAction - Message Admin</title>
    <link rel="icon" href="../../assets/LIALogo.ico" type="image/x-icon">
    <link rel="stylesheet" href="studentMessage.css">
    <link rel="stylesheet" href="../../pageEnhancements.css">
    <script src="../../pageEnhancements.js" defer></script>
</head>
<body>

    <!-- TOP NAVIGATION BAR -->
    <header class="topbar">
        <div class="topbar-left">
            <button onclick="toggleSidebar()" class="menu-btn" title="Toggle Menu">☰</button>
            <img src="../../assets/lagroHSLogo.png" alt="School Logo" class="topbar-logo">
        </div>

        <div class="topbar-center">
            PROJECT LIA
        </div>

        <div class="topbar-right">
            <span class="user-name">Student Test</span>
                <a href="../studentReports/studentReports.html" class="profile-link" title="Go to Profile">
                <img src="../../assets/profilePic.jpg" alt="User Profile" class="profile-pic">
            </a>
        </div>
    </header>

    <!-- MAIN BODY CONTAINER -->
    <div class="app-body">

        <!-- SIDEBAR -->
        <aside id="sidebar" class="sidebar closed">
            <!-- SOS ALERT BUTTON -->
            <div class="sos-container">
                <button onclick="openSosModal()" class="sos-btn">
                    <span class="sos-text">SOS</span>
                </button>
            </div>

            <!-- NAVIGATION LINKS -->
            <ul class="nav-list">
                <li class="nav-item"><a href="../studentHome/studentHome.html">Home</a></li>
                <li class="nav-item"><a href="../studentSubmitReports/studentSubmit.html">Submit Report</a></li>
                <li class="nav-item active"><a href="../studentMessages/studentMessage.html">Message</a></li>
                <li class="nav-item"><a href="../studentReports/studentReports.html">My Account</a></li>
            </ul>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">

            <section class="chat-container-wrapper">
                
                <!-- CHAT CARD CONTAINER -->
                <div class="chat-card">

                    <!-- CHAT HEADER -->
                    <div class="chat-header">
                        <div class="admin-info">
                            <img src="../../assets/lagroHSLogo.png" alt="Guidance Admin Logo" class="admin-avatar">
                            <div class="admin-details">
                                <h3 class="admin-name">Guidance & Disciplinary Office</h3>
                                <p class="admin-status">Online • Official Support</p>
                            </div>
                        </div>
                    </div>

                    <!-- CHAT MESSAGES BODY -->
                    <div id="chatBody" class="chat-body">
                    </div>

                    <!-- CHAT INPUT FOOTER -->
                    <div class="chat-footer">
                        <form id="chatForm" onsubmit="handleSendMessage(event)" class="chat-form">
                            <input 
                                type="text" 
                                id="messageInput" 
                                placeholder="Type your message to Guidance Admin..." 
                                autocomplete="off" 
                                required
                            >
                            <button type="submit" class="btn-send">Send</button>
                        </form>
                    </div>

                </div>

            </section>

        </main>
    </div>

    <!-- SOS ALERT MODAL -->
    <div id="sosModal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Confirm SOS Dispatch</h3>
                <p>This will trigger an immediate emergency alert to the guidance office.</p>
                <button onclick="closeSosModal()" class="close-modal-btn" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
            </div>
            <form onsubmit="handleSosSubmit(event)" class="modal-body">
                <div class="field-group">
                    <label for="sosLocation">Your exact location right now:</label>
                    <input type="text" id="sosLocation" required placeholder="e.g. Near Gate 2, Grade 8 & 7 Building">
                </div>
                <div class="field-group">
                    <label for="sosDescription">Brief Description / Threats:</label>
                    <textarea id="sosDescription" rows="3" required placeholder="e.g. Cornered by 5 students, threatening physical violence"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-send-sos">Send SOS</button>
                    <button type="button" onclick="closeSosModal()" class="btn-cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="studentMessage.js"></script>
    <script src="../../sos.js"></script>
</body>
</html>
