<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LagroInAction - Admin Messages</title>
    <link rel="icon" href="../../assets/LIALogo.ico" type="image/x-icon">
    <link rel="stylesheet" href="adminMessage.css">
    <link rel="stylesheet" href="../../pageEnhancements.css">
    <script src="../../pageEnhancements.js" defer></script>
</head>
<body>

    <!-- TOP NAVIGATION BAR -->
    <header class="topbar">
        <div class="topbar-left">
            <button onclick="toggleSidebar()" class="menu-btn" title="Toggle Menu">☰</button>
            <img src="../../assets/lagroHSLogo.png" alt="School Logo" class="topbar-logo">
        </div>

        <div class="topbar-center">
            PROJECT LIA
        </div>

        <div class="topbar-right">
            <span class="user-name">Guidance Admin</span>
            <div class="profile-link">
                <img src="../../assets/lagroHSLogo.png" alt="Admin Profile" class="profile-pic">
            </div>
        </div>
    </header>

    <!-- MAIN BODY CONTAINER -->
    <div class="app-body">

        <!-- FIXED SIDEBAR -->
        <aside id="sidebar" class="sidebar closed">
            <ul class="nav-list">
                <li class="nav-item"><a href="../adminHome/adminHome.html">Home</a></li>
                <li class="nav-item"><a href="../adminDashboard/adminDashboard.html">Dashboard</a></li>
                <li class="nav-item"><a href="../adminManageReports/adminManage.html">Manage Reports</a></li>
                <li class="nav-item"><a href="../adminReportRecords/adminRecords.html">Report Records</a></li>
                <li class="nav-item"><a href="../adminRequestAccount/adminRequest.html">Registration Requests</a></li>
                <li class="nav-item active"><a href="../adminMessages/adminMessage.html">Messages</a></li>
            </ul>
        </aside>

        <!-- MAIN CONTENT AREA WITH FLOATING CARD WRAPPER -->
        <main class="main-content">
            <div class="chat-card">

                <!-- INBOX SIDEBAR (STUDENT LIST) -->
                <div class="chat-sidebar">
                    <div class="chat-search-box">
                        <input type="text" id="studentSearch" placeholder="Search student name or LRN..." onkeyup="filterStudents()">
                    </div>

                    <div class="student-list" id="studentList">
                        <p class="empty-state">No student conversations yet.</p>
                    </div>
                </div>

                <!-- CHAT MAIN WORKSPACE -->
                <div class="chat-main">
                    
                    <!-- CHAT HEADER -->
                    <div class="chat-header">
                        <div class="active-student-details">
                            <h3 id="activeStudentName">No conversation selected</h3>
                                <p id="activeStudentSub">Messages from students will appear here.</p>
                        </div>
                        <button class="btn btn-scan" onclick="viewCaseDetails()">View Linked Case</button>
                    </div>

                    <!-- CHAT MESSAGES THREAD -->
                    <div class="chat-messages" id="chatMessages"></div>

                    <!-- CHAT INPUT AREA -->
                    <form class="chat-input-area" onsubmit="sendMessage(event)">
                        <input type="text" id="messageInput" placeholder="Type your response to the student..." required autocomplete="off">
                        <button type="submit" class="btn-send">Send Message</button>
                    </form>

                </div>

            </div>
        </main>
    </div>

    <script src="../../adminGuard.js"></script>
    <script src="../../localDatabase.js"></script>
    <script src="adminMessage.js"></script>
</body>
</html>
