<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages · LagroInAction staff</title>
  <link rel="icon" href="/assets/img/favicon.ico">
  <link rel="stylesheet" href="/assets/css/lia.css">
</head>
<body data-area="admin" data-page="messages">
  <main>
    <div class="wide">
      <div class="split" id="split">
        <section class="card convo-list-card">
          <div class="convo-list-head"><h1>Messages</h1><p class="small muted" id="listHint">Yellow dot: waiting for a reply.</p></div>
          <!-- Which chats to show. Principal and security only have Staff. -->
          <div class="chat-tabs" id="chatTabs" role="tablist" aria-label="Kind of chat">
            <button type="button" role="tab" data-tab="reports" aria-selected="true">Reports <span class="count-pill" data-tab-count="reports" hidden></span></button>
            <button type="button" role="tab" data-tab="students" aria-selected="false">Students <span class="count-pill" data-tab-count="students" hidden></span></button>
            <button type="button" role="tab" data-tab="staff" aria-selected="false">Staff <span class="count-pill" data-tab-count="staff" hidden></span></button>
          </div>
          <div class="convo-list" id="convos"><div class="skeleton"></div></div>
        </section>

        <section class="card chat" id="chat">
          <header class="chat-head">
            <button class="icon-btn" id="back" aria-label="Back to chats" hidden></button>
            <span class="avatar" id="chatAvatar" hidden></span>
            <div class="chat-title"><strong id="chatName">Choose a chat</strong><span class="small muted" id="chatInfo"></span></div>
            <div class="chat-tools" id="chatTools" hidden>
              <button class="btn btn-quiet btn-sm" id="viewInfo" type="button">View Info</button>
              <button class="btn btn-quiet btn-sm" id="viewCase" type="button">View Case</button>
              <button class="btn btn-quiet btn-sm" id="printReports" type="button">Print Reports</button>
            </div>
          </header>
          <div class="chat-log" id="log" aria-live="polite">
            <div class="empty"><strong>No chat open</strong><span id="noChatHint">Pick a chat on the left. To message the reporter of a report (even an anonymous one), open the report and press Message.</span></div>
          </div>
          <form class="chat-form" id="chatForm" hidden>
            <label class="visually-hidden" for="text">Reply</label>
            <textarea class="input" id="text" name="text" rows="1" maxlength="2000" placeholder="Write a reply"></textarea>
            <button class="btn" type="submit">Send</button>
          </form>
        </section>
      </div>
    </div>
  </main>
  <script src="/assets/js/core.js"></script>
  <script src="/assets/js/pages/admin-case.js"></script>
  <script src="/assets/js/pdf.js"></script>
  <script src="/assets/js/print.js"></script>
  <script src="/assets/js/chat.js"></script>
  <script>
    (async () => {
      const me = await LIA.start();
      // Counselor and advocates chat with students AND staff. Principal and security: staff only.
      const withStudents = ['counselor', 'advocate'].includes(me.account.role);
      const convosEl = document.getElementById('convos');
      const log = document.getElementById('log');
      const form = document.getElementById('chatForm');
      const split = document.getElementById('split');
      const back = document.getElementById('back');
      back.innerHTML = LIA.icon('arrowLeft');

      // The open chat: { case: 12 }, { user: 5 } or { staff: 3 }, from the address (?case=12, ?user=5 or ?staff=3)
      const params = new URLSearchParams(location.search);
      let current = params.get('case') ? { case: Number(params.get('case')) }
        : params.get('user') ? { user: Number(params.get('user')) }
        : params.get('staff') ? { staff: Number(params.get('staff')) } : null;
      if (!withStudents && current && !current.staff) current = null;
      const keyOf = (c) => (c ? (c.case ? 'case-' + c.case : c.user ? 'user-' + c.user : 'staff-' + c.staff) : '');
      const tabOf = (c) => (c?.case ? 'reports' : c?.user ? 'students' : 'staff');
      let tab = withStudents ? tabOf(current || { case: 1 }) : 'staff';
      let thread = null;     // what the server says about the open chat (student chats)
      let person = null;     // the staff member in the open staff chat
      let messages = [];
      let lastSig = '';
      let threads = [];      // chats with students (reports + general)
      let people = [];       // every other staff member

      const tabsEl = document.getElementById('chatTabs');
      if (!withStudents) {
        tabsEl.hidden = true;
        document.getElementById('noChatHint').textContent = 'Pick a staff member on the left to start a chat.';
      }
      const HINTS = {
        reports: 'One chat per report. Yellow dot: waiting for a reply.',
        students: 'General chats with students and guests. Yellow dot: waiting for a reply.',
        staff: withStudents ? 'Chat with other staff members.' : 'Chat with the guidance staff and other staff members.',
      };

      // ----- List of chats -----
      const when = (at) => (at ? `<time class="when" title="${LIA.esc(LIA.fmtDateTime(at))}">${LIA.esc(LIA.shortWhen(at))}</time>` : '');
      function drawList() {
        tabsEl.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
        // Little numbers on the buttons: chats waiting for a reply / unread staff messages
        const counts = {
          reports: threads.filter((t) => t.kind === 'case' && t.waitingForReply).length,
          students: threads.filter((t) => t.kind !== 'case' && t.waitingForReply).length,
          staff: people.reduce((n, p) => n + p.unread, 0),
        };
        Object.entries(counts).forEach(([k, n]) => {
          const el = tabsEl.querySelector(`[data-tab-count="${k}"]`);
          el.textContent = n; el.hidden = !n;
        });
        document.getElementById('listHint').textContent = HINTS[tab];

        if (tab === 'staff') {
          convosEl.innerHTML = people.length ? people.map((p) => `
            <button class="convo" data-key="staff-${p.adminId}" ${'staff-' + p.adminId === keyOf(current) ? 'aria-current="true"' : ''}>
              <span class="avatar staff">${LIA.esc(LIA.initials(p.name))}</span>
              <span class="who"><strong>${LIA.esc(p.name)}</strong>
                <span class="sub">${LIA.esc(p.roleLabel)}</span>
                <span>${p.lastText ? LIA.esc((p.lastFromMe ? 'You: ' : '') + p.lastText) : 'No messages yet'}</span></span>
              <span class="convo-end">${when(p.lastAt)}${p.unread ? `<span class="count-pill" title="Unread messages">${p.unread}</span>` : ''}</span>
            </button>`).join('')
            : '<p class="small muted convo-empty">There are no other staff accounts yet.</p>';
          return;
        }
        const list = threads.filter((t) => (tab === 'reports' ? t.kind === 'case' : t.kind !== 'case'));
        convosEl.innerHTML = list.length ? list.map((t) => `
            <button class="convo" data-key="${t.key}" ${t.key === keyOf(current) ? 'aria-current="true"' : ''}>
              <span class="avatar ${t.kind === 'case' ? 'case' : t.accountType === 'guest' ? 'guest' : ''}">${t.kind === 'case' ? '#' : LIA.esc(LIA.initials(t.name))}</span>
              <span class="who"><strong>${t.kind === 'case' ? `Case #${t.reportNo}` : LIA.esc(t.name)}</strong>
                <span class="sub">${t.kind === 'case' ? LIA.esc(t.name + ' · ' + t.category) : 'General chat'}</span>
                <span>${LIA.esc(t.lastText)}</span></span>
              <span class="convo-end">${when(t.lastAt)}${t.waitingForReply ? '<span class="dot" title="Waiting for a reply"></span>' : ''}</span>
            </button>`).join('')
          : `<p class="small muted convo-empty">${tab === 'reports'
            ? 'No report chats yet. To message the reporter of a report (even an anonymous one), open the report and press Message.'
            : 'No general chats yet. Students can message the guidance office from their Message page.'}</p>`;
      }
      async function loadList() {
        try {
          const [student, staff] = await Promise.all([
            withStudents ? LIA.api('admin/messages.php') : Promise.resolve({ threads: [] }),
            LIA.api('admin/staff_chat.php'),
          ]);
          threads = student.threads;
          people = staff.people;
          drawList();
        } catch (e) { convosEl.innerHTML = `<p class="small muted convo-empty">${LIA.esc(e.message)}</p>`; }
      }
      tabsEl.addEventListener('click', (e) => {
        const b = e.target.closest('[data-tab]');
        if (!b || b.dataset.tab === tab) return;
        tab = b.dataset.tab;
        drawList();
      });
      convosEl.addEventListener('click', (e) => {
        const b = e.target.closest('[data-key]');
        if (!b) return;
        const [kind, n] = b.dataset.key.split('-');
        open(kind === 'case' ? { case: Number(n) } : kind === 'user' ? { user: Number(n) } : { staff: Number(n) });
      });
      function open(c) {
        current = c;
        composer.stopEditing();
        history.replaceState(null, '', '?' + (c.case ? 'case=' + c.case : c.user ? 'user=' + c.user : 'staff=' + c.staff));
        convosEl.querySelectorAll('.convo').forEach((x) => x.toggleAttribute('aria-current', x.dataset.key === keyOf(c)));
        lastSig = '';
        loadChat();
      }

      // ----- One chat -----
      const caseCard = (c) => `<button type="button" class="case-card" data-case-no="${c.reportNo}">${LIA.icon('folder')}<span><b>Report #${c.reportNo}</b>${LIA.esc(c.category)} · ${LIA.esc(c.status)}</span></button>`;

      // A chat with another staff member: name and role at the top, no student tools
      async function loadStaffChat() {
        const res = await LIA.api('admin/staff_chat.php?with=' + current.staff);
        person = res.person;
        thread = null;
        messages = res.messages;
        split.classList.add('has-chat');
        back.hidden = false;
        form.hidden = false;
        document.getElementById('chatTools').hidden = true;
        const av = document.getElementById('chatAvatar');
        av.hidden = false;
        av.textContent = LIA.initials(person.name);
        av.className = 'avatar staff';
        document.getElementById('chatName').textContent = person.name;
        document.getElementById('chatInfo').textContent = person.roleLabel + ' · Staff chat';
        const sig = 'staff-' + person.adminId + JSON.stringify(messages.map((m) => [m.id, m.text, m.deleted, m.edited]));
        if (sig === lastSig) return;
        const wasUnread = people.find((p) => p.adminId === person.adminId)?.unread;
        lastSig = sig;
        log.innerHTML = messages.length
          ? CHAT.render(messages, { caseCard: () => '', who: (m) => m.staffName })
          : `<div class="empty"><strong>No messages yet</strong><span>Write the first message to ${LIA.esc(person.name)} below.</span></div>`;
        log.scrollTop = log.scrollHeight;
        if (wasUnread) loadList(); // opening the chat marked them read
      }

      async function loadChat() {
        if (!current) return;
        if (current.staff) {
          try { await loadStaffChat(); } catch (e) { LIA.toast(e.message, 'error'); }
          return;
        }
        try {
          const res = await LIA.api('admin/messages.php?' + (current.case ? 'case=' + current.case : 'user=' + current.user));
          person = null;
          thread = res.thread;
          messages = res.messages;
          split.classList.add('has-chat');
          back.hidden = false;
          form.hidden = false;
          document.getElementById('chatTools').hidden = false;
          const isCase = thread.kind === 'case';
          document.getElementById('viewCase').textContent = isCase ? 'View Case' : 'View Linked Cases';
          document.getElementById('printReports').hidden = isCase || thread.accountType === 'guest';
          const av = document.getElementById('chatAvatar');
          av.hidden = false;
          av.textContent = isCase ? '#' : LIA.initials(thread.name);
          av.className = 'avatar ' + (isCase ? 'case' : thread.accountType === 'guest' ? 'guest' : '');
          document.getElementById('chatName').textContent = isCase ? `Case #${thread.reportNo} · ${thread.name}` : thread.name;
          document.getElementById('chatInfo').textContent = [
            isCase ? `${thread.category} · ${LIA.STATUS[thread.status]?.staff || thread.status}` : 'General chat',
            thread.anonymous ? 'Identity hidden: your replies reach the reporter' : '',
            thread.expired ? 'Account expired: they can no longer read replies' : '',
          ].filter(Boolean).join(' · ');
          const sig = thread.key + JSON.stringify(messages.map((m) => [m.id, m.text, m.deleted, m.edited]));
          if (sig === lastSig) return;
          lastSig = sig;
          log.innerHTML = messages.length
            ? CHAT.render(messages, { caseCard, who: () => (thread.anonymous ? 'Reporter' : thread.name) })
            : '<div class="empty"><strong>No messages yet</strong><span>Write the first message below.</span></div>';
          log.scrollTop = log.scrollHeight;
        } catch (e) { LIA.toast(e.message, 'error'); }
      }

      // Opening a case card in the chat
      log.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-case-no]');
        if (b) openCase(Number(b.dataset.caseNo));
      });
      async function openCase(no) {
        try {
          const { reports } = await LIA.api('admin/reports.php');
          const r = reports.find((x) => x.reportNo === no);
          if (r) CASE.open(r, () => { lastSig = ''; loadChat(); }); else LIA.toast('That report was not found.', 'error');
        } catch (err) { LIA.toast(err.message, 'error'); }
      }

      // "View Info": the student's details, after typing your password (anonymous reports: contact number only)
      document.getElementById('viewInfo').addEventListener('click', () => {
        if (thread) CASE.showStudent(thread.kind === 'case' ? { report: thread.reportNo } : { user: thread.userId });
      });

      // This student's reports that show their name (anonymous reports are never linked to a person)
      async function linkedReports() {
        const { reports } = await LIA.api('admin/reports.php');
        return reports.filter((r) => !r.anonymous && r.reporter && r.reporter.userId === thread.userId);
      }
      const noLinkedText = () => `No linked cases. ${thread.accountType === 'guest' ? 'Guest reports are always anonymous, so they are never linked to a person.' : 'This student has no reports with their name shown that you can open.'}`;

      // "View Case" (case chat) / "View Linked Cases" (general chat)
      document.getElementById('viewCase').addEventListener('click', async () => {
        if (!thread) return;
        if (thread.kind === 'case') return openCase(thread.reportNo);
        let linked;
        try { linked = await linkedReports(); } catch (e) { return LIA.toast(e.message, 'error'); }
        LIA.openModal({
          title: 'Linked Cases',
          wide: true,
          body: linked.length
            ? `<p class="small muted">Reports sent by ${LIA.esc(thread.name)} with their name shown.</p>
               <div class="table-scroll"><table class="data-table"><thead><tr><th>Report</th><th>Category</th><th>Filed</th><th>Status</th><th></th></tr></thead><tbody>
               ${linked.map((r) => `<tr><td><b>#${r.reportNo}</b></td><td>${LIA.esc(r.category)}</td><td>${LIA.esc(LIA.fmtDateTime(r.submittedAt))}</td><td>${LIA.chip(r.status, 'staff')}</td><td><button class="btn btn-quiet btn-sm" data-case="${r.reportNo}">View Details</button></td></tr>`).join('')}
               </tbody></table></div>`
            : `<p class="form-note" style="margin:0">${noLinkedText()}</p>`,
          foot: '<button class="btn btn-gray" data-close>Close</button>',
          onOpen: (el, close) => {
            el.addEventListener('click', (e) => {
              const b = e.target.closest('[data-case]');
              if (b) { close(); CASE.open(linked.find((r) => r.reportNo === Number(b.dataset.case))); }
            });
          },
        });
      });

      // "Print Reports" (general chat): this student's reports as a table, printed or saved as PDF
      document.getElementById('printReports').addEventListener('click', async () => {
        let linked;
        try { linked = await linkedReports(); } catch (e) { return LIA.toast(e.message, 'error'); }
        if (!linked.length) return LIA.toast(noLinkedText(), 'error');
        PRINT.choose({
          title: `Reports of ${thread.name}`,
          columns: [{ label: 'Case ID', width: 50 }, { label: 'Incident Category', width: 110 }, { label: 'Location', width: 110 },
            { label: 'Date Filed', width: 105 }, { label: 'Status', width: 95 }, { label: 'Last Update', width: 105 }, { label: 'Reason (if not accepted)' }],
          sets: [{ label: `All reports with ${thread.name}'s name shown (${linked.length})`, rows: linked.map((r) => [
            `#${r.reportNo}`, r.category, r.location, LIA.fmtDateTime(r.submittedAt), r.status + (r.archived ? ' (archived)' : ''),
            LIA.fmtDateTime(r.updatedAt || r.submittedAt), r.status === 'Rejected' ? (r.rejectReason || '') : '']) }],
          filename: `reports-${(thread.name || 'student').toLowerCase().replace(/[^a-z0-9]+/g, '-')}`,
        });
      });

      // "+" next to the message box: Attach File, and (general chats with students) Attach Case
      const attach = ATTACH.setup({ form, onCase: () => attachCase(), canCase: () => !current?.staff && thread?.kind === 'general' });
      async function attachCase() {
        let linked;
        try { linked = await linkedReports(); } catch (e) { return LIA.toast(e.message, 'error'); }
        if (!linked.length) return LIA.toast(noLinkedText(), 'error');
        LIA.openModal({
          title: 'Attach a report case',
          wide: true,
          body: `<form id="attachForm" novalidate>
              <fieldset class="print-choice"><legend>Choose the case to follow up</legend>
                ${linked.map((r, i) => `<label class="check-row"><input type="radio" name="reportNo" value="${r.reportNo}" ${i === 0 ? 'checked' : ''}>
                  <span><b>#${r.reportNo}</b> · ${LIA.esc(r.category)} · ${LIA.esc(LIA.fmtDate(r.submittedAt))} · ${LIA.esc(r.status)}</span></label>`).join('')}
              </fieldset>
              <div class="field"><label for="attachText">Message (optional)</label>
                <textarea class="input" id="attachText" name="text" maxlength="2000" placeholder="e.g. Hi, we would like to follow up on this report. Can you come to the guidance office on Monday?"></textarea></div>
            </form>`,
          foot: '<button class="btn btn-gray" data-close>Cancel</button><button class="btn" form="attachForm" type="submit">Send case</button>',
          onOpen: (el, close) => {
            el.querySelector('#attachForm').addEventListener('submit', async (e) => {
              e.preventDefault();
              const f = e.target;
              try {
                const res = await LIA.busy(el.querySelector('[form=attachForm]'), () =>
                  LIA.api('admin/messages.php', { body: { user: thread.userId, reportNo: f.reportNo.value, text: f.text.value.trim() } }));
                close(); LIA.toast(res.message);
                lastSig = ''; await Promise.all([loadChat(), loadList()]);
              } catch (err) { LIA.showFormError(f, err.message); }
            });
          },
        });
      }

      // Send, edit and delete (the ⋮ menu next to your own messages)
      // Student chats go to admin/messages.php, staff chats to admin/staff_chat.php
      const target = () => (current.case ? { case: current.case } : current.user ? { user: current.user } : { with: current.staff });
      const endpoint = () => (current?.staff ? 'admin/staff_chat.php' : 'admin/messages.php');
      const composer = CHAT.composer({
        form, log, attach,
        messages: () => messages,
        send: (text, file) => {
          let body = { ...target(), text };
          if (file) { body = new FormData(); Object.entries(target()).forEach(([k, v]) => body.append(k, v)); body.append('text', text); body.append('file', file); }
          return LIA.api(endpoint(), { body });
        },
        edit: (id, text) => LIA.api(endpoint(), { body: { action: 'edit', id, text } }),
        remove: (id) => LIA.api(endpoint(), { body: { action: 'delete', id } }),
        reload: () => { lastSig = ''; return Promise.all([loadChat(), loadList()]); },
      });

      back.addEventListener('click', () => { split.classList.remove('has-chat'); });
      await loadList();
      await loadChat();
      setInterval(() => { loadList(); if (!composer.isEditing()) loadChat(); }, 10000);
    })();
  </script>
</body>
</html>
